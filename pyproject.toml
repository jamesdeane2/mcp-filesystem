[project]
name = "mcp-filesystem"
version = "0.2.0"
description = "Production-ready MCP filesystem server built with FastMCP 2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "aiofiles>=24.0.0",
]

[project.scripts]
mcp-filesystem = "mcp_filesystem.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

