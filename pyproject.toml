[project]
name = "mcp-filesystem"
version = "0.1.0"
description = "MCP filesystem server for Claude Desktop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "click>=8.1.0",
    "aiofiles>=24.0.0",
]

[project.scripts]
mcp-filesystem = "mcp_filesystem.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

